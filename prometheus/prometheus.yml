global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nestjs'
    metrics_path: /metrics
    static_configs:
      - targets: ['nestjs:3003']

  - job_name: 'my-nestjs-app'
    static_configs:
      - targets: ['nestjs:9464']      
      
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9464']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:9464']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:9464']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:9464']

