global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    platform: nest-ms-platform
    environment: production

rule_files:
  # - "rules/*.yml"   # enable later for alerts

scrape_configs:

  - job_name: 'nestjs'
    metrics_path: /metrics
    static_configs:
      - targets: ['nestjs:3003']

  - job_name: 'my-nestjs-app'
    static_configs:
      - targets: ['nestjs:9464']   

  # -----------------------------------
  # Prometheus self-metrics
  # -----------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'prometheus:9090'

  # -----------------------------------
  # API Gateway (HTTP + TCP client)
  # -----------------------------------
  - job_name: 'api-gateway'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'api-gateway:9465'
        labels:
          service: api-gateway
          transport: http

  # -----------------------------------
  # User Service (TCP)
  # -----------------------------------
  - job_name: 'user-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'user-service:9466'
        labels:
          service: user-service
          transport: tcp

  # -----------------------------------
  # Order Service (TCP)
  # -----------------------------------
  - job_name: 'order-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'order-service:9467'
        labels:
          service: order-service
          transport: tcp

  # -----------------------------------
  # Payment Service (TCP)
  # -----------------------------------
  - job_name: 'payment-service'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'payment-service:9468'
        labels:
          service: payment-service
          transport: tcp

